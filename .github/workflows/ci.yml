name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint API
        run: cd packages/api && bun run lint

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run API tests
        run: cd packages/api && bun test

  test-bot:
    name: Test Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bot tests
        run: cd packages/bot && bun test

  test-integration:
    name: Test Integration (real PG/Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moenet
          POSTGRES_PASSWORD: moenet_test
          POSTGRES_DB: moenet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moenet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: moenet
      DB_USER: moenet
      DB_PASSWORD: moenet_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NODE_ENV: test
      INTEGRATION: "1"
      AGENT_API_KEY: test-key
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs in its OWN invocation (not the unit `bun test`): the unit tests
      # mock.module dbContext, and Bun's module mocks are process-global.
      - name: Run integration tests
        run: cd packages/api && bun test tests/integration

  changeset-check:
    name: Changeset Check
    # Skip the PRs that never carry a changeset by design: the changesets
    # bot's own "Version Packages" PR (baseBranch is dev, so that branch is
    # changeset-release/dev), and Dependabot bumps.
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref != 'changeset-release/dev'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails the PR if a workspace package changed without a changeset.
      # api and bot are a `fixed` group, so one changeset versions both.
      # For a change that genuinely needs no release, say so explicitly:
      # `bun run changeset add --empty`.
      - name: Require a changeset
        run: bunx changeset status --since=origin/${{ github.base_ref }}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-ok:
    name: CI OK
    # Single required check for branch protection: adding/removing jobs or
    # having a job legitimately skip won't break the ruleset — only a real
    # failure/cancellation does.
    if: always()
    needs:
      - typecheck
      - lint
      - test-api
      - test-bot
      - test-integration
      - changeset-check
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required job did not pass: $r"
              exit 1
            fi
          done
